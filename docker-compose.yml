services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-backend}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-backend}"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0_password}
      POSTGRES_DB: ${JUDGE0_DB_NAME:-judge0}
    volumes:
      - judge0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JUDGE0_DB_USER:-judge0} -d ${JUDGE0_DB_NAME:-judge0}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-server:
    image: judge0/judge0:v1.13.1
    restart: unless-stopped
    ports:
      - "${JUDGE0_PORT:-2358}:2358"
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0_password}
      POSTGRES_DB: ${JUDGE0_DB_NAME:-judge0}
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:v1.13.1
    restart: unless-stopped
    privileged: true
    command: ["./scripts/workers"]
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0_password}
      POSTGRES_DB: ${JUDGE0_DB_NAME:-judge0}
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-backend}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      SERVER_READ_TIMEOUT: 5s
      SERVER_WRITE_TIMEOUT: 10s
      SERVER_IDLE_TIMEOUT: 60s
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-backend}
      DATABASE_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me}
      JWT_EXPIRATION: 24h
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_TIMEOUT: 30s
      EXEC_PROVIDER: ${EXEC_PROVIDER:-judge0}
      EXEC_BASE_URL: ${EXEC_BASE_URL:-http://judge0-server:2358}
      EXEC_API_KEY: ${EXEC_API_KEY:-}
      EXEC_CPU_TIME_LIMIT_SEC: ${EXEC_CPU_TIME_LIMIT_SEC:-5}
      EXEC_WALL_TIME_LIMIT_SEC: ${EXEC_WALL_TIME_LIMIT_SEC:-10}
      EXEC_MEMORY_LIMIT_KB: ${EXEC_MEMORY_LIMIT_KB:-131072}
      EXEC_MAX_CODE_BYTES: ${EXEC_MAX_CODE_BYTES:-65536}
      EXEC_RATE_LIMIT_ENABLED: ${EXEC_RATE_LIMIT_ENABLED:-true}
      EXEC_RATE_LIMIT_PER_MINUTE: ${EXEC_RATE_LIMIT_PER_MINUTE:-15}
      EXEC_RATE_LIMIT_BURST: ${EXEC_RATE_LIMIT_BURST:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-120}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  judge0_data:
